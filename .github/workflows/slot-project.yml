name: slot-project

on:
  push:
    paths: ["slot-project/**", ".github/workflows/slot-project.yml"]
  pull_request:
    paths: ["slot-project/**", ".github/workflows/slot-project.yml"]

jobs:
  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: slot-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: SDK unit tests
        run: dotnet test sdk/SlotSdk.sln
      - name: Math verification (theory = full cycle, Monte Carlo within 4 sigma)
        run: |
          dotnet run -c Release --project sdk/dotnet/SlotSdk.Simulator -- \
            report math/neon_fortune.json --rounds 5000000 --seed 1
      - name: Unity copy of the math matches the source of truth
        run: cmp math/neon_fortune.json unity/Assets/_Game/Resources/Math/neon_fortune.json
      - name: Sample game smoke run
        run: dotnet run --project samples/ConsoleSlot -- --demo 30 --seed 1 --no-color > /dev/null
